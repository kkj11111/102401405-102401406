<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>校园失物招领 · 发布与搜索流程</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; font-family:"Microsoft YaHei","PingFang SC",sans-serif; padding:26px 24px; }
  .title { text-align:center; font-size:20px; font-weight:700; color:#1e3a8a; margin-bottom:18px; }
  .row { display:flex; flex-direction:column; gap:10px; margin-bottom:22px; }
  .path-label { font-size:12px; font-weight:700; color:#2563eb; margin-bottom:2px; }
  .flow { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; }
  .node {
    min-width:150px; max-width:210px; padding:11px 14px; border-radius:12px;
    font-size:13.5px; font-weight:600; text-align:center; line-height:1.45;
  }
  .node small { display:block; font-weight:400; opacity:.8; font-size:11.5px; margin-top:2px; }
  .start { background:#2563eb; color:#fff; }
  .mid   { background:#eff6ff; color:#1e40af; border:2px solid #bfdbfe; }
  .check { background:#fef3c7; color:#92400e; border:2px solid #fde68a; }
  .end   { background:#16a34a; color:#fff; }
  .empty { background:#f1f5f9; color:#475569; border:2px dashed #cbd5e1; }
  .arrow { display:flex; flex-direction:column; align-items:center; }
  .arrow svg { width:32px; height:15px; }
  .arrow span { font-size:10.5px; color:#94a3b8; }
  .yes { color:#16a34a; font-size:10.5px; font-weight:700; }
  .no  { color:#dc2626; font-size:10.5px; font-weight:700; }
</style>
</head>
<body>
<div class="title">发布与搜索 · 程序流程</div>

<div class="row">
  <div class="path-label">流程一 · 发布信息（含校验分支）</div>
  <div class="flow">
    <div class="node start">进入发布页<small>选择 寻物/招领</small></div>
    <div class="arrow"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="node mid">填写表单<small>物品名称/地点/联系方式…</small></div>
    <div class="arrow"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="node check">validatePublish 校验
      <small>名称≤30字｜地点必填｜联系方式格式</small></div>
  </div>
  <div style="text-align:center">
    <span class="no">✗ 不通过</span>
    <span class="arrow" style="display:inline-flex;vertical-align:middle"><svg viewBox="0 0 32 15" style="transform:rotate(90deg)"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="node mid" style="display:inline-flex;vertical-align:middle;padding:7px 12px;min-width:auto">逐字段错误提示 → 修改重填</span>
    <span style="margin:0 10px">｜</span>
    <span class="yes">✓ 通过</span>
    <span class="arrow" style="display:inline-flex;vertical-align:middle"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#16a34a" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="node end" style="display:inline-flex;vertical-align:middle;padding:7px 12px;min-width:auto">发布成功页<small>saveItems → 首页/搜索可见</small></span>
  </div>
</div>

<div class="row">
  <div class="path-label">流程二 · 搜索物品（含无结果分支）</div>
  <div class="flow">
    <div class="node start">进入搜索页<small>或首页搜索框</small></div>
    <div class="arrow"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="node mid">输入关键词<small>或点热门/历史标签</small></div>
    <div class="arrow"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="node check">filterItems<small>关键词×类型×类别×状态</small></div>
    <div class="arrow"><svg viewBox="0 0 32 15"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#3b82f6" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
    <div class="node mid">结果列表<small>卡片可点击进详情</small></div>
  </div>
  <div style="text-align:center">
    <span class="no">✗ 无结果</span>
    <span class="arrow" style="display:inline-flex;vertical-align:middle"><svg viewBox="0 0 32 15" style="transform:rotate(90deg)"><path d="M3 7h24m0 0l-5-5m5 5l-5 5" stroke="#dc2626" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    <span class="node empty" style="display:inline-flex;vertical-align:middle;padding:7px 12px;min-width:auto">空态提示<small>“换个关键词试试，或去发布”</small></span>
  </div>
</div>
</body>
</html>
