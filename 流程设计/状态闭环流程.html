<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<title>校园失物招领 · 状态更新闭环流程</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#fff; font-family:"Microsoft YaHei","PingFang SC",sans-serif; padding:30px 24px; }
  .title { text-align:center; font-size:21px; font-weight:700; color:#1e3a8a; margin-bottom:4px; }
  .subtitle { text-align:center; font-size:12px; color:#94a3b8; margin-bottom:24px; }
  .flow { display:flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px; }
  .node {
    min-width:170px; max-width:230px; padding:13px 16px; border-radius:12px;
    font-size:14px; font-weight:600; text-align:center; line-height:1.5;
  }
  .node small { display:block; font-weight:400; opacity:.8; font-size:12px; margin-top:2px; }
  .n1 { background:#eff6ff; color:#1e40af; border:2px solid #bfdbfe; }
  .n2 { background:#2563eb; color:#fff; }
  .n3 { background:#16a34a; color:#fff; }
  .n4 { background:#f1f5f9; color:#475569; border:2px dashed #cbd5e1; }
  .arrow { display:flex; flex-direction:column; align-items:center; color:#64748b; }
  .arrow svg { width:34px; height:16px; }
  .arrow span { font-size:11px; color:#94a3b8; }
  .branch { display:flex; align-items:center; gap:6px; margin-top:14px; justify-content:center; flex-wrap:wrap; }
</style>
</head>
<body>
<div class="title">信息状态更新 · 闭环流程</div>
<div class="subtitle">谁修改、从哪个入口修改、修改后其他用户在哪里看到结果——一条闭环</div>

<div class="flow">
  <div class="node n1">发布信息<small>createItem → status=open（进行中）</small></div>
  <div class="arrow"><svg viewBox="0 0 34 16"><path d="M3 8h26m0 0l-6-6m6 6l-6 6" stroke="#3b82f6" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="node n2">发布者修改状态<small>入口①详情页「标记为已找到/已归还」<br/>入口②我的发布「标记」按钮（弹窗确认）</small></div>
  <div class="arrow"><svg viewBox="0 0 34 16"><path d="M3 8h26m0 0l-6-6m6 6l-6 6" stroke="#16a34a" stroke-width="2.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="node n3">status=done<small>updateStatus → saveItems → localStorage</small></div>
</div>

<div class="branch">
  <div class="node n4">其他用户视角自动同步<small>首页列表显示「已找到/已归还」徽标<br/>搜索列表同步显示<br/>详情页进入「已结案」态，隐藏修改按钮</small></div>
  <div class="arrow"><svg viewBox="0 0 34 16"><path d="M28 2L5 2m0 0l6-6m-6 6l6 6" stroke="#64748b" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></div>
  <div class="node n1">我的发布「重新开放」<small>可恢复为 open，继续寻找/等待认领</small></div>
</div>
</body>
</html>
