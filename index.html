<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>校园失物招领</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232563eb'/%3E%3Cpath d='M32 14a10 10 0 0 0-10 10v8h-4v20h28V32h-4v-8a10 10 0 0 0-10-10zm0 4a6 6 0 0 1 6 6v8h-12v-8a6 6 0 0 1 6-6z' fill='white'/%3E%3C/svg%3E"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="app">
  <!-- 顶部栏（页面切换时由 app.js 更新标题） -->
  <header id="app-header">
    <div class="header-inner">
      <div class="logo-badge">失</div>
      <div class="header-text">
        <h1 id="header-title">校园失物招领</h1>
        <p id="header-sub">福州大学 · 旗山校区</p>
      </div>
    </div>
  </header>

  <!-- 页面视图容器 -->
  <main id="view" aria-live="polite"></main>

  <!-- 底部导航 -->
  <nav id="tabbar" class="tabbar">
    <button class="tab-item" data-tab="home">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
      <span>首页</span>
    </button>
    <button class="tab-item" data-tab="search">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <span>搜索</span>
    </button>
    <button class="tab-item tab-publish" data-tab="publish">
      <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      <span>发布</span>
    </button>
    <button class="tab-item" data-tab="mine">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
      <span>我的</span>
    </button>
  </nav>
</div>

<script src="js/core.js"></script>
<script src="js/storage.js"></script>
<script src="js/app.js"></script>
</body>
</html>
